server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: patient-service
          uri: http://localhost:8082
          predicates:
            - Path=/patient/**
        - id: record-service
          uri: http://localhost:8083
          predicates:
            - Path=/record/**
        - id: appointment-service
          uri: http://localhost:8084
          predicates:
            - Path=/appointment/**
  data:
    mongodb:
      uri: mongodb://localhost:27017/hospitalDB

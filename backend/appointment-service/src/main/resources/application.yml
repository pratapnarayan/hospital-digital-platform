server:
  port: 8084

spring:
  application:
    name: appointment-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/hospitalDB
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-bytes!!}
  expiration: 86400000

hospital:
  internal-secret: super-secret-internal-key-for-hospital-services
